<!DOCTYPE html>
<html>
<head>
<title>Scientific</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<button class="toggle" onclick="toggleMode()">🌙</button>

<h1>Scientific Calculator</h1>

<div class="card">

<input id="display">

<!-- Row 1 -->
<button onclick="append('1')">1</button>
<button onclick="append('2')">2</button>
<button onclick="append('3')">3</button>
<button onclick="append('4')">4</button>

<!-- Row 2 -->
<button onclick="append('5')">5</button>
<button onclick="append('6')">6</button>
<button onclick="append('7')">7</button>
<button onclick="append('8')">8</button>

<!-- Row 3 -->
<button onclick="append('9')">9</button>
<button onclick="append('0')">0</button>
<button onclick="append('+')">+</button>
<button onclick="append('-')">−</button>

<!-- Row 4 -->
<button onclick="append('*')">x</button>
<button onclick="append('/')">÷</button>
<button onclick="calculate()">=</button>
<button onclick="append('.')">.</button>

<!-- Controls -->
<button onclick="clearDisplay()">C</button>
<button onclick="del()">DEL</button>

<!-- Trigonometry -->
<button onclick="calculateTrig('sin')">sin</button>
<button onclick="calculateTrig('cos')">cos</button>
<button onclick="calculateTrig('tan')">tan</button>

</div>

<a href="index.html"><button>Back</button></a>

<script src="script.js"></script>
</body>
</html>
