<p class="formula">1 + tan²θ = sec²θ</p>
<p class="formula">1 + cot²θ = cosec²θ</p>
<p class="formula">tanθ = sinθ / cosθ</p>
<p class="formula">sin(90° − θ) = cosθ</p>
<p class="formula">cos(90° − θ) = sinθ</p>
