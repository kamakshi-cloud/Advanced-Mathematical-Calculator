<h1>📊 Statistics Formulas</h1>

<div class="card">
<p class="formula">Mean = Σx / n</p>
<p class="formula">Median = Middle value</p>
<p class="formula">Mode = Most frequent value</p>
<p class="formula">Variance = Σ(x − μ)² / n</p>
<p class="formula">Standard Deviation = √Variance</p>
</div>
